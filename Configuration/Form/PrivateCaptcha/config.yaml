name: private-captcha/typo3
label: 'Private Captcha'
priority: 1774639825

prototypes:
  standard:
    formEditor:
      translationFiles:
        1774639825: 'EXT:private_captcha/Resources/Private/Language/locallang_form.xlf'

    formElementsDefinition:
      Form:
        renderingOptions:
          translation:
            translationFiles:
              1774639825: 'EXT:private_captcha/Resources/Private/Language/locallang_form.xlf'
          partialRootPaths:
            1774639825: 'EXT:private_captcha/Resources/Private/Form/'

      PrivateCaptcha:
        formEditor:
          label: formEditor.elements.PrivateCaptcha.label
          description: formEditor.elements.PrivateCaptcha.description
          group: custom
          groupSorting: 900
          iconIdentifier: form-hidden
          editors:
            100:
              identifier: header
              templateName: Inspector-FormElementHeaderEditor
            200:
              identifier: label
              templateName: Inspector-TextEditor
              label: formEditor.elements.FormElement.editor.label.label
              propertyPath: label
            9999:
              identifier: removeButton
              templateName: Inspector-RemoveElementEditor
        implementationClassName: TYPO3\CMS\Form\Domain\Model\FormElements\GenericFormElement
        properties:
          containerClassAttribute: form-element form-element-private-captcha mb-3
          elementClassAttribute: private-captcha-solution
        renderingOptions:
          templateName: PrivateCaptcha
        variants:
          -
            identifier: hide-on-summary-and-email
            renderingOptions:
              enabled: false
            condition: 'stepType == "SummaryPage" || finisherIdentifier in ["EmailToSender", "EmailToReceiver"]'
