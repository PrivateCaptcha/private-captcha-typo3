<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true"
>

<f:layout name="Module" />

<f:section name="Before">
    <f:asset.module identifier="@typo3/backend/modal.js" />
</f:section>

<f:section name="Content">
    <h1><f:translate key="LLL:EXT:private_captcha/Resources/Private/Language/locallang_mod.xlf:settings.heading" /></h1>

    <div class="list-group mb-4">
        <a
            class="list-group-item list-group-item-action {f:if(condition: backendSelected, then: 'active')}"
            href="{f:be.uri(route: 'private_captcha_settings.backend')}"
            aria-current="{f:if(condition: backendSelected, then: 'page', else: 'false')}"
        >
            <f:translate key="LLL:EXT:private_captcha/Resources/Private/Language/locallang_mod.xlf:settings.backend" />
        </a>
        <f:for each="{siteIdentifiers}" as="siteIdentifier">
            <a
                class="list-group-item list-group-item-action {f:if(condition: '{selectedSiteIdentifier} == {siteIdentifier}', then: 'active')}"
                href="{f:be.uri(route: 'private_captcha_settings.site', parameters: '{site: siteIdentifier}')}"
                aria-current="{f:if(condition: '{selectedSiteIdentifier} == {siteIdentifier}', then: 'page', else: 'false')}"
            >
                <f:translate key="LLL:EXT:private_captcha/Resources/Private/Language/locallang_mod.xlf:settings.site" arguments="{0: siteIdentifier}" />
            </a>
        </f:for>
    </div>

    <f:if condition="{scopeSelected}">
        <f:render
            partial="Settings/Fields"
            arguments="{settings: settings, siteSelected: siteSelected, backendSelected: backendSelected, powermailAvailable: powermailAvailable, settingsActionUri: settingsActionUri}"
        />
    </f:if>
</f:section>

</html>
