<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:variable name="privateCaptchaMarkup" value="{f:cObject(typoscriptObjectPath: 'lib.privateCaptchaPowermail', data: field)}" />
<f:if condition="{privateCaptchaMarkup}">
    <div class="powermail_fieldwrap powermail_fieldwrap_type_privatecaptcha powermail_fieldwrap_{field.marker} {field.css} {settings.styles.framework.fieldAndLabelWrappingClasses}">
        <div class="{settings.styles.framework.fieldWrappingClasses}">
            <f:render partial="Form/FieldLabel" arguments="{_all}" />
            <f:form.hidden
                id="powermail_field_{field.marker}"
                property="{field.marker}"
                value=""
                class="powermail_privatecaptcha {settings.styles.framework.fieldClasses}"
                respectSubmittedDataValue="false"
            />
            {privateCaptchaMarkup -> f:format.raw()}
            <f:if condition="{settings.validation.client}">
                <div class="powermail_field_error_container powermail_field_error_container_{field.marker}"></div>
            </f:if>
        </div>
    </div>
</f:if>
</html>
